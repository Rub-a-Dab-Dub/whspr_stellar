[workspace]
members = [
    "messaging",
]
resolver = "2"

[workspace.dependencies]
# No default features here: the "testutils" feature pulls in std-only code
# (serde_json, rand) that can't compile for the no_std wasm32 release target.
# Member crates opt into it explicitly under [dev-dependencies] instead.
soroban-sdk = { version = "21.0.0" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
